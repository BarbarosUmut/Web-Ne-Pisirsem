<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dolabındaki malzemelere göre evde yapabileceğin yemekleri öneren tarif uygulaması." />
    <meta name="theme-color" content="#fffbf5" />
    <!-- Sayfa çizilmeden önce temayı uygula: karanlık modda beyaz "flaş" olmasın -->
    <script>
      try {
        var t = localStorage.getItem('ne-pisirsem:theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>Ne Pişirsem? — Evdeki Malzemelerle Yemek Önerisi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
